name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yohan
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: yohan
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U yohan -d yohan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://yohan:ci-only-password@127.0.0.1:5433/yohan?schema=public
      BETTER_AUTH_SECRET: ci-only-auth-secret-never-use-in-production-2026
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm build
      - name: Integration tests on the production server
        run: |
          pnpm start > /tmp/yohan-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/projects > /dev/null; then
              break
            fi
            sleep 2
          done
          pnpm test:integration || { cat /tmp/yohan-server.log; exit 1; }
