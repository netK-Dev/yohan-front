name: yohan-front

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yohan
      POSTGRES_USER: yohan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:local first}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yohan -d yohan']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
